# Scheduled data refresh: get data/ -> commit -> build -> deploy to prod. The repo variable DATA_SOURCE picks where
# data/ comes from (docs/DEPLOY.md):
#
# - pipeline (default, or unset): scrape -> segments -> images -> score here, daily at 06:00 UTC and hourly around
#   event days (scripts/should_run.py decides; other hourly runs exit early). A non-blocking shadow job then diffs
#   data/ against the fightcard-engine's /v1/ API into the job summary.
# - v1: probe the engine's /v1/index.json every run and download its snapshot when newer (scripts/fetch_v1.py),
#   then validate data/ with the site's schema (npm run validate-data); an unusable one fails the run. A stale one
#   keeps data/ and opens the single "Data API stale" issue; only the daily and manual runs also fail on it.
#
# Any step exiting non-zero fails the job before anything is committed or deployed.
#
# Prod is deployed by calling infra's deploy-app.yml directly rather than by pushing a v* tag: a tag pushed with
# GITHUB_TOKEN doesn't trigger release.yml. The data commit doesn't trigger release.yml either, so staging keeps
# running the last code push. See docs/DEPLOY.md.
name: refresh

on:
  schedule:
    - cron: "0 6 * * *" # daily; keep in sync with DAILY_CRON in scripts/should_run.py
    - cron: "17 * * * *" # hourly, off the daily slot; only does work around event days
  workflow_dispatch: # always runs, and always rebuilds and redeploys prod

concurrency:
  group: refresh
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    if: vars.DATA_SOURCE != 'v1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/should_run.py --data data --event-name "$EVENT_NAME" --schedule "$SCHEDULE"

  pipeline:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      # The ufcstats `_fmc` cookie (valid 7 days). Cache keys are immutable, so each run saves a new entry and
      # restores the newest one.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ufcstats
          key: ufcstats-cookie-${{ github.run_id }}
          restore-keys: ufcstats-cookie-

      - name: Scrape ufcstats
        run: uv run --project pipeline fightcard --data data scrape --cookie-file .cache/ufcstats/cookies.json
      - name: Tag card segments
        run: uv run --project pipeline fightcard --data data segments
      - name: Fetch headshots
        run: uv run --project pipeline fightcard --data data images
      - name: Score finish tiers
        run: uv run --project pipeline fightcard --data data score

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # A code push may have landed meanwhile; data/ is only written here, so the rebase can't conflict.
            git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build stale-model issue body
        id: stale
        run: python3 scripts/stale_issue.py --data data --out "$RUNNER_TEMP/stale-issue.md"
      - name: Open, update or close the "Re-export finish model" issue
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.stale.outputs.stale }}
          TITLE: Re-export finish model
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == env.TITLE) | .number" | head -n1)
          if [ "$STALE" = true ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/stale-issue.md"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/stale-issue.md"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Nothing stale after the latest refresh."
          fi

  # Non-blocking: reports how /v1/ differs from what the pipeline just committed. Nothing waits for it.
  shadow:
    needs: pipeline
    if: needs.pipeline.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.pipeline.outputs.sha }}
      - name: Diff data/ against /v1/
        env:
          V1_BASE: https://ufc-data.xlobax.com
        run: python3 scripts/v1_shadow.py --base "$V1_BASE" --ours data --summary "$GITHUB_STEP_SUMMARY"

  v1:
    if: vars.DATA_SOURCE == 'v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Refuses an unsafe or non-1.x snapshot (exit 1: the run fails) and a stale (> 26 h) one (exit 3). Stale fails
      # only the daily and manual runs; hourly runs go on with the committed data/ and leave the alert to the issue.
      # A snapshot no newer than data/ is skipped (exit 0), usually told from the /v1/index.json probe alone. data/
      # stays as committed in all of these. DAILY_CRON must match the daily cron above (a test checks it).
      - name: Fetch /v1/ snapshot
        id: fetch
        env:
          V1_BASE: https://ufc-data.xlobax.com
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DAILY_CRON: "0 6 * * *"
        run: |
          status=0
          python3 scripts/fetch_v1.py --base "$V1_BASE" --data data \
            --stale-issue "$RUNNER_TEMP/v1-stale-issue.md" || status=$?
          if [ "$status" -eq 3 ] && [ "$EVENT_NAME" = schedule ] && [ "$SCHEDULE" != "$DAILY_CRON" ]; then
            echo "::warning::/v1/ is stale; kept the committed data/ (see the \"Data API stale\" issue)"
            exit 0
          fi
          exit "$status"

      # The site's own loader and schema (site/src/lib/data.ts) over the data/ about to be committed: a snapshot the
      # build would reject fails the run here, before anything reaches main.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate data/ with the site schema
        run: npm ci && npm run validate-data
        working-directory: site

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh from /v1/ $(date -u +%Y-%m-%dT%H:%MZ)"
            # A code push may have landed meanwhile; data/ is only written here, so the rebase can't conflict.
            git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Also after a daily run failed on staleness. No `stale` output (any other failure) leaves the issue alone.
      - name: Open, update or close the "Data API stale" issue
        if: ${{ !cancelled() && steps.fetch.outputs.stale != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.fetch.outputs.stale }}
          GENERATED_AT: ${{ steps.fetch.outputs.generated_at }}
          TITLE: Data API stale
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == env.TITLE) | .number" | head -n1)
          if [ "$STALE" = true ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/v1-stale-issue.md"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/v1-stale-issue.md"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "/v1/ is fresh again (generated_at $GENERATED_AT)."
          fi

  # One of pipeline/v1 is always skipped, hence always(); a failed or cancelled source never builds.
  build:
    needs: [pipeline, v1]
    if: >-
      always() && (
        (needs.pipeline.result == 'success' &&
          (needs.pipeline.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')) ||
        (needs.v1.result == 'success' &&
          (needs.v1.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'))
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.pipeline.outputs.sha || needs.v1.outputs.sha }}

  # Shares release.yml's prod-deploy lock, so a tag deploy that read older data/ can't land after this one.
  prod:
    needs: [pipeline, v1, build]
    if: always() && needs.build.result == 'success'
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    uses: alexzfe/infra/.github/workflows/deploy-app.yml@main
    with:
      app: ufc
      env: prod
      tag: ${{ needs.pipeline.outputs.sha || needs.v1.outputs.sha }}
      url: https://ufc.xlobax.com
      purge_cache: true
    secrets: inherit

  # deploy-app curls / only. /rankings/ is the page a deploy with older data/ lost (2026-10-27).
  smoke:
    needs: prod
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check /rankings/ is served
        env:
          URL: https://ufc.xlobax.com/rankings/
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null "$URL"
