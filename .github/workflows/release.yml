# From infra/templates/app-release.yml, for the `ufc` entry in infra/sites.yml.
#
#   PR            -> test
#   push to main  -> test, build ghcr.io/alexzfe/fight-card-website:<sha>, deploy to staging
#   push tag v*   -> deploy the image already built for that commit to prod, then cut a GitHub Release
#
# Prod never rebuilds: the tag points at a commit main already built and staging already ran. Data refreshes
# deploy to prod on their own (refresh.yml); see docs/DEPLOY.md.
name: release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv run --project pipeline pytest pipeline/tests
      - run: uv run --project pipeline pytest scripts/tests
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npm test
        working-directory: site

  build:
    if: github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  staging:
    needs: build
    uses: alexzfe/infra/.github/workflows/deploy-app.yml@main
    with:
      app: ufc
      env: staging
      tag: ${{ github.sha }}
      url: https://ufc-staging.xlobax.com
    secrets: inherit

  prod:
    if: github.ref_type == 'tag'
    uses: alexzfe/infra/.github/workflows/deploy-app.yml@main
    with:
      app: ufc
      env: prod
      tag: ${{ github.sha }}
      url: https://ufc.xlobax.com
    secrets: inherit

  release:
    needs: prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
