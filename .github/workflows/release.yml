# From infra/templates/app-release.yml, for the `ufc` entry in infra/sites.yml.
#
#   PR            -> test
#   push to main  -> test, build ghcr.io/alexzfe/fight-card-website:<sha>, deploy to staging
#   push tag v*   -> build that commit's code with main's latest data/ and deploy it to prod (prod.yml), then cut a
#                    GitHub Release
#
# Prod never runs untested code: the tag points at a commit main already built and staging already ran. Its image
# is rebuilt only to swap in main's data/, so a tag never rolls prod's data back. Data refreshes deploy to prod on
# their own (refresh.yml); see docs/DEPLOY.md.
name: release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv run --project pipeline pytest pipeline/tests
      - run: uv run --project pipeline pytest scripts/tests
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npm test
        working-directory: site
      # Browsers keyed on the lockfile (it pins @playwright/test). A cache hit still needs the OS packages.
      - id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: site
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: site
      - run: npm run test:e2e
        working-directory: site

  build:
    if: github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  staging:
    needs: build
    uses: alexzfe/infra/.github/workflows/deploy-app.yml@main
    with:
      app: ufc
      env: staging
      tag: ${{ github.sha }}
      url: https://ufc-staging.xlobax.com
      purge_cache: true
    secrets: inherit

  # Same lock as refresh.yml's prod deploy: main's data/ is read and deployed with no refresh deploy in between.
  prod:
    if: github.ref_type == 'tag'
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/prod.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  release:
    needs: prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
